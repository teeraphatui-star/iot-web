<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - PC Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; font-family: system-ui, sans-serif; }
        .glass { background: rgba(30,41,59,.7); border: 1px solid rgba(255,255,255,.05); box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
    </style>
</head>
<body class="text-white min-h-screen p-4 md:p-8">
<div class="max-w-7xl mx-auto">
    <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <h1 class="text-2xl md:text-3xl font-bold text-cyan-400">ประวัติย้อนหลัง</h1>
        <div class="flex flex-wrap items-center gap-2">
            <button data-r="1h" class="rb px-4 py-2 rounded-lg text-sm">1 ชั่วโมง</button>
            <button data-r="6h" class="rb px-4 py-2 rounded-lg text-sm">6 ชั่วโมง</button>
            <button data-r="24h" class="rb px-4 py-2 rounded-lg text-sm">24 ชั่วโมง</button>
            <a id="csv" href="#" class="px-4 py-2 rounded-lg text-sm bg-emerald-600 hover:bg-emerald-500">ดาวน์โหลด CSV</a>
            <a href="/summary.html" class="px-4 py-2 rounded-lg text-sm bg-slate-700 hover:bg-slate-600">สรุปรายวัน</a>
            <a href="/" class="px-4 py-2 rounded-lg text-sm bg-slate-700 hover:bg-slate-600">กลับหน้า Dashboard</a>
        </div>
    </header>

    <div class="glass rounded-2xl p-4 mb-6 overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead class="text-gray-400"><tr><th class="py-2">ค่าที่วัด</th><th>ต่ำสุด</th><th>เฉลี่ย</th><th>สูงสุด</th></tr></thead>
            <tbody id="stats"></tbody>
        </table>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="glass rounded-2xl p-4 h-72"><canvas id="c1"></canvas></div>
        <div class="glass rounded-2xl p-4 h-72"><canvas id="c2"></canvas></div>
    </div>
    <p id="msg" class="text-gray-400 text-sm mt-4"></p>
</div>

<script>
    const COL = { temperature: '#f97316', humidity: '#60a5fa', pm25: '#4ade80', smoke: '#ef4444' };
    const NAME = { temperature: 'อุณหภูมิ (°C)', humidity: 'ความชื้น (%)', pm25: 'ฝุ่น (ug/m³)', smoke: 'ควัน (ppm)' };
    const mk = (id, keys) => new Chart(document.getElementById(id), {
        type: 'line',
        data: { labels: [], datasets: keys.map(k => ({ label: NAME[k], borderColor: COL[k], backgroundColor: COL[k] + '22', borderWidth: 2, pointRadius: 0, tension: .3, data: [] })) },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#cbd5e1' } } },
            scales: {
                x: { ticks: { color: '#64748b', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,.05)' } },
                y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,.05)' } }
            }
        }
    });
    const env = mk('c1', ['temperature', 'humidity']);
    const air = mk('c2', ['pm25', 'smoke']);
    let range = '1h';

    async function load() {
        document.querySelectorAll('.rb').forEach(b =>
            b.className = 'rb px-4 py-2 rounded-lg text-sm ' + (b.dataset.r === range ? 'bg-cyan-600' : 'bg-slate-700 hover:bg-slate-600'));
        document.getElementById('csv').href = '/api/export.csv?range=' + range;
        const msg = document.getElementById('msg');
        try {
            const [rows, st] = await Promise.all([
                fetch('/api/history?range=' + range).then(r => r.json()),
                fetch('/api/stats?range=' + range).then(r => r.json())
            ]);
            if (!Array.isArray(rows) || rows.length === 0) {
                msg.textContent = 'ยังไม่มีข้อมูลในช่วงนี้ รอให้ ESP32 ส่งข้อมูลอย่างน้อย 2 นาที หรือตรวจสอบการตั้งค่า Firebase';
            } else {
                msg.textContent = 'ข้อมูล ' + rows.length + ' จุด (ค่าเฉลี่ยทุก 1 นาที) อัปเดตอัตโนมัติทุก 1 นาที';
            }
            const data = Array.isArray(rows) ? rows : [];
            const labels = data.map(r => new Date(r.ts).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }));
            [[env, ['temperature', 'humidity']], [air, ['pm25', 'smoke']]].forEach(([c, ks]) => {
                c.data.labels = labels;
                ks.forEach((k, i) => { c.data.datasets[i].data = data.map(r => r[k]); });
                c.update();
            });
            document.getElementById('stats').innerHTML = Object.keys(NAME).map(k => {
                const s = st[k];
                return '<tr class="border-t border-white/5"><td class="py-2" style="color:' + COL[k] + '">' + NAME[k] + '</td>' +
                    (s ? '<td>' + s.min + '</td><td>' + s.avg + '</td><td>' + s.max + '</td>' : '<td colspan="3" class="text-gray-500">-</td>') + '</tr>';
            }).join('');
        } catch (e) {
            msg.textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message;
        }
    }

    document.querySelectorAll('.rb').forEach(b => b.onclick = () => { range = b.dataset.r; load(); });
    load();
    setInterval(load, 60000);
</script>
</body>
</html>
