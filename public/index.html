<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Monitor Pro Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <!-- Chart.js สำหรับทำกราฟ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome สำหรับไอคอน -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f172a; /* พื้นหลังสีเทาเข้มแบบ Slate 900 */
        } 
        .font-digital { font-family: 'Orbitron', sans-serif; }
        
        /* สไตล์กล่องกระจกใส */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="text-white min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        
        <!-- Header -->
        <header class="flex items-center justify-center mb-10 space-x-4">
            <i class="fa-solid fa-computer text-4xl text-cyan-400 drop-shadow-[0_0_15px_rgba(34,211,238,0.6)]"></i>
            <h1 class="text-3xl md:text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-wider font-digital drop-shadow-lg">
                PC HARDWARE MONITOR
            </h1>
        </header>
        
        <!-- ส่วนที่ 1: การ์ดแสดงตัวเลขปัจจุบัน -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <!-- อุณหภูมิ -->
            <div class="glass-panel p-6 rounded-2xl flex flex-col relative overflow-hidden group transition duration-300 hover:scale-105">
                <div class="absolute -right-4 -top-4 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <i class="fa-solid fa-temperature-half text-8xl text-orange-500"></i>
                </div>
                <div class="flex items-center space-x-3 mb-4 z-10">
                    <div class="bg-orange-500/20 p-3 rounded-xl text-orange-500">
                        <i class="fa-solid fa-temperature-full text-xl"></i>
                    </div>
                    <h2 class="text-gray-400 text-sm font-bold tracking-widest uppercase">Temperature</h2>
                </div>
                <div class="flex items-baseline font-digital z-10">
                    <span id="temp" class="text-5xl font-black text-orange-500 drop-shadow-[0_0_10px_rgba(249,115,22,0.4)]">0.0</span>
                    <span class="ml-2 text-xl text-gray-500">°C</span>
                </div>
            </div>

            <!-- ความชื้น -->
            <div class="glass-panel p-6 rounded-2xl flex flex-col relative overflow-hidden group transition duration-300 hover:scale-105">
                <div class="absolute -right-4 -top-4 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <i class="fa-solid fa-droplet text-8xl text-blue-400"></i>
                </div>
                <div class="flex items-center space-x-3 mb-4 z-10">
                    <div class="bg-blue-400/20 p-3 rounded-xl text-blue-400">
                        <i class="fa-solid fa-water text-xl"></i>
                    </div>
                    <h2 class="text-gray-400 text-sm font-bold tracking-widest uppercase">Humidity</h2>
                </div>
                <div class="flex items-baseline font-digital z-10">
                    <span id="hum" class="text-5xl font-black text-blue-400 drop-shadow-[0_0_10px_rgba(96,165,250,0.4)]">0.0</span>
                    <span class="ml-2 text-xl text-gray-500">%</span>
                </div>
            </div>

            <!-- ค่าฝุ่น -->
            <div class="glass-panel p-6 rounded-2xl flex flex-col relative overflow-hidden group transition duration-300 hover:scale-105">
                <div class="absolute -right-2 -top-4 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <i class="fa-solid fa-virus text-8xl text-green-400"></i>
                </div>
                <div class="flex items-center space-x-3 mb-4 z-10">
                    <div class="bg-green-400/20 p-3 rounded-xl text-green-400">
                        <i class="fa-solid fa-wind text-xl"></i>
                    </div>
                    <h2 class="text-gray-400 text-sm font-bold tracking-widest uppercase">Dust (PM2.5)</h2>
                </div>
                <div class="flex items-baseline font-digital z-10">
                    <span id="dust" class="text-5xl font-black text-green-400 drop-shadow-[0_0_10px_rgba(74,222,128,0.4)]">0.00</span>
                    <span class="ml-2 text-xl text-gray-500">ug/m³</span>
                </div>
            </div>

            <!-- ควัน -->
            <div class="glass-panel p-6 rounded-2xl flex flex-col relative overflow-hidden group transition duration-300 hover:scale-105">
                <div class="absolute -right-4 -top-4 p-4 opacity-10 group-hover:opacity-20 transition-opacity">
                    <i class="fa-solid fa-smog text-8xl text-red-500"></i>
                </div>
                <div class="flex items-center space-x-3 mb-4 z-10">
                    <div class="bg-red-500/20 p-3 rounded-xl text-red-500">
                        <i class="fa-solid fa-fire text-xl"></i>
                    </div>
                    <h2 class="text-gray-400 text-sm font-bold tracking-widest uppercase">Smoke Level</h2>
                </div>
                <div class="flex items-baseline font-digital z-10">
                    <span id="smoke" class="text-5xl font-black text-red-500 drop-shadow-[0_0_10px_rgba(239,68,68,0.4)]">0.00</span>
                    <span class="ml-2 text-xl text-gray-500">ug/m³</span>
                </div>
            </div>
        </div>

        <!-- ส่วนที่ 2: พื้นที่กราฟ Real-time -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- กราฟอุณหภูมิและความชื้น -->
            <div class="glass-panel p-6 rounded-2xl">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-300"><i class="fa-solid fa-chart-line mr-2 text-blue-400"></i>Environment Timeline</h3>
                </div>
                <div class="relative h-64 w-full">
                    <canvas id="envChart"></canvas>
                </div>
            </div>
            
            <!-- กราฟคุณภาพอากาศ (ฝุ่นและควัน) -->
            <div class="glass-panel p-6 rounded-2xl">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-300"><i class="fa-solid fa-chart-area mr-2 text-green-400"></i>Air Quality Timeline</h3>
                </div>
                <div class="relative h-64 w-full">
                    <canvas id="airChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- โค้ดจัดการข้อมูลและวาดกราฟ -->
    <script>
        const maxDataPoints = 15; // จำนวนจุดข้อมูลที่จะแสดงบนกราฟก่อนเลื่อน
        
        // ตั้งค่ากราฟ Environment (Temp & Humidity)
        const ctxEnv = document.getElementById('envChart').getContext('2d');
        const envChart = new Chart(ctxEnv, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Temp (°C)',
                        borderColor: '#f97316', 
                        backgroundColor: 'rgba(249, 115, 22, 0.1)',
                        borderWidth: 3,
                        pointRadius: 2,
                        pointBackgroundColor: '#f97316',
                        tension: 0.4,
                        data: []
                    },
                    {
                        label: 'Humidity (%)',
                        borderColor: '#60a5fa', 
                        backgroundColor: 'rgba(96, 165, 250, 0.1)',
                        borderWidth: 3,
                        pointRadius: 2,
                        pointBackgroundColor: '#60a5fa',
                        tension: 0.4,
                        data: []
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#cbd5e1', font: { family: 'Inter' } } } },
                scales: {
                    x: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });

        // ตั้งค่ากราฟ Air Quality (Dust & Smoke)
        const ctxAir = document.getElementById('airChart').getContext('2d');
        const airChart = new Chart(ctxAir, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Dust (ug/m³)',
                        borderColor: '#4ade80', 
                        backgroundColor: 'rgba(74, 222, 128, 0.15)',
                        borderWidth: 3,
                        pointRadius: 2,
                        pointBackgroundColor: '#4ade80',
                        tension: 0.4,
                        fill: true, // ระบายสีใต้กราฟ
                        data: []
                    },
                    {
                        label: 'Smoke (ug/m³)',
                        borderColor: '#ef4444', 
                        backgroundColor: 'rgba(239, 68, 68, 0.15)',
                        borderWidth: 3,
                        pointRadius: 2,
                        pointBackgroundColor: '#ef4444',
                        tension: 0.4,
                        fill: true, // ระบายสีใต้กราฟ
                        data: []
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#cbd5e1', font: { family: 'Inter' } } } },
                scales: {
                    x: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                    y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });

        // รับค่าจาก Socket.io และอัปเดตหน้าเว็บ
        const socket = io();
        socket.on('sensor_update', (data) => {
            // 1. อัปเดตตัวเลขบนการ์ด
            document.getElementById('temp').innerText = data.temperature.toFixed(1);
            document.getElementById('hum').innerText = data.humidity.toFixed(1);
            document.getElementById('dust').innerText = data.pm25.toFixed(2);
            document.getElementById('smoke').innerText = data.smoke.toFixed(2);

            // 2. สร้างเวลาปัจจุบันเพื่อใช้เป็นแกน X ของกราฟ
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + 
                               now.getMinutes().toString().padStart(2, '0') + ':' + 
                               now.getSeconds().toString().padStart(2, '0');

            // 3. ยัดข้อมูลใหม่ลงกราฟ Environment
            envChart.data.labels.push(timeString);
            envChart.data.datasets[0].data.push(data.temperature);
            envChart.data.datasets[1].data.push(data.humidity);
            if(envChart.data.labels.length > maxDataPoints) {
                envChart.data.labels.shift(); // ลบข้อมูลเก่าสุดทิ้งเพื่อให้กราฟเลื่อน
                envChart.data.datasets[0].data.shift();
                envChart.data.datasets[1].data.shift();
            }
            envChart.update();

            // 4. ยัดข้อมูลใหม่ลงกราฟ Air Quality
            airChart.data.labels.push(timeString);
            airChart.data.datasets[0].data.push(data.pm25);
            airChart.data.datasets[1].data.push(data.smoke);
            if(airChart.data.labels.length > maxDataPoints) {
                airChart.data.labels.shift();
                airChart.data.datasets[0].data.shift();
                airChart.data.datasets[1].data.shift();
            }
            airChart.update();
        });
    </script>
</body>
</html>
