<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สรุปรายวัน - PC Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; font-family: system-ui, sans-serif; }
        .glass { background: rgba(30,41,59,.7); border: 1px solid rgba(255,255,255,.05); box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
    </style>
</head>
<body class="text-white min-h-screen p-4 md:p-8">
<div class="max-w-7xl mx-auto">
    <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold text-cyan-400">สรุปรายวัน</h1>
            <p id="date" class="text-gray-400 text-sm"></p>
        </div>
        <div class="flex flex-wrap gap-2">
            <a href="/history.html" class="px-4 py-2 rounded-lg text-sm bg-slate-700 hover:bg-slate-600">ประวัติย้อนหลัง</a>
            <a href="/" class="px-4 py-2 rounded-lg text-sm bg-slate-700 hover:bg-slate-600">กลับหน้า Dashboard</a>
        </div>
    </header>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="glass rounded-2xl p-4"><p class="text-gray-400 text-sm">อุณหภูมิสูงสุดวันนี้</p><p id="tmax" class="text-3xl font-bold text-orange-500">-</p></div>
        <div class="glass rounded-2xl p-4"><p class="text-gray-400 text-sm">อุณหภูมิต่ำสุดวันนี้</p><p id="tmin" class="text-3xl font-bold text-blue-400">-</p></div>
        <div class="glass rounded-2xl p-4"><p class="text-gray-400 text-sm">ตรวจพบควันหรือไม่</p><p id="smoke" class="text-3xl font-bold">-</p><p id="smokeSub" class="text-xs text-gray-400"></p></div>
        <div class="glass rounded-2xl p-4"><p class="text-gray-400 text-sm">ฝุ่นเฉลี่ยวันนี้</p><p id="dust" class="text-3xl font-bold text-green-400">-</p><p id="dustSub" class="text-xs text-gray-400"></p></div>
    </div>

    <div class="glass rounded-2xl p-4 mb-6">
        <p class="text-gray-300 text-sm mb-2">สัดส่วนเวลาในแต่ละระดับฝุ่นวันนี้</p>
        <div id="lvBar" class="flex h-4 rounded overflow-hidden bg-slate-700"></div>
        <div id="lvLegend" class="flex flex-wrap gap-x-4 gap-y-1 text-xs mt-2"></div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <div class="glass rounded-2xl p-4 h-72"><canvas id="c1"></canvas></div>
        <div class="glass rounded-2xl p-4 h-72"><canvas id="c2"></canvas></div>
    </div>

    <div class="glass rounded-2xl p-4 overflow-x-auto">
        <p class="text-gray-300 text-sm mb-2">สรุปย้อนหลัง (เก็บใน Firebase)</p>
        <table class="w-full text-sm text-left">
            <thead class="text-gray-400"><tr><th class="py-2">วันที่</th><th>อุณหภูมิสูงสุด</th><th>อุณหภูมิต่ำสุด</th><th>ควัน</th><th>ฝุ่นเฉลี่ย</th><th>ฝุ่นสูงสุด</th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</div>

<script>
    const LV = [['ดีมาก', '#60a5fa'], ['ดี', '#4ade80'], ['ปานกลาง', '#facc15'], ['สะสมมาก', '#fb923c'], ['วิกฤต', '#ef4444']];
    const $ = id => document.getElementById(id);
    const f = (v, u = '') => v == null ? '-' : v + u;
    const lbl = [...Array(24).keys()].map(h => String(h).padStart(2, '0') + ':00');
    const opt = extra => ({
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#cbd5e1' } } },
        scales: Object.assign({
            x: { ticks: { color: '#64748b', maxTicksLimit: 12 }, grid: { color: 'rgba(255,255,255,.05)' } },
            y: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,.05)' } }
        }, extra || {})
    });
    const ds = (label, color, fill) => ({ label, borderColor: color, backgroundColor: color + '22', borderWidth: 2, pointRadius: 2, tension: .3, fill: !!fill, data: [] });
    const c1 = new Chart($('c1'), { type: 'line', data: { labels: lbl, datasets: [ds('อุณหภูมิสูงสุด (°C)', '#f97316'), ds('อุณหภูมิต่ำสุด (°C)', '#60a5fa')] }, options: opt() });
    const smokeDs = ds('ควันสูงสุด (ppm)', '#ef4444'); smokeDs.yAxisID = 'y1';
    const c2 = new Chart($('c2'), { type: 'line', data: { labels: lbl, datasets: [ds('ฝุ่นสูงสุด (ug/m³)', '#4ade80', true), smokeDs] },
        options: opt({ y1: { position: 'right', ticks: { color: '#ef4444' }, grid: { drawOnChartArea: false } } }) });
    const hr = (h, k) => lbl.map((_, i) => h[i] ? h[i][k] : null); // ชั่วโมงที่ไม่มีข้อมูล = เว้นว่าง

    async function load() {
        try {
            const [t, days] = await Promise.all([
                fetch('/api/summary/today').then(r => r.json()),
                fetch('/api/summary/days?n=7').then(r => r.json())
            ]);
            $('date').textContent = 'วันที่ ' + t.date + ' (เวลาไทย) · ' + t.n + ' ตัวอย่าง อัปเดตอัตโนมัติทุก 30 วินาที';
            $('tmax').textContent = f(t.temp.max, ' °C');
            $('tmin').textContent = f(t.temp.min, ' °C');
            const s = t.smoke;
            $('smoke').textContent = t.n === 0 ? '-' : (s.detected ? 'ตรวจพบ' : 'ไม่พบ');
            $('smoke').className = 'text-3xl font-bold ' + (s.detected ? 'text-red-500' : 'text-green-400');
            $('smokeSub').textContent = t.n === 0 ? '' : 'สูงสุด ' + Number(s.max).toFixed(1) + ' ppm · เกินเกณฑ์ ' + s.limit + ' คิดเป็น ' + s.percent + '% ของเวลา';
            $('dust').textContent = f(t.dust.avg, ' ug/m³');
            $('dustSub').textContent = 'ต่ำสุด ' + f(t.dust.min) + ' · สูงสุด ' + f(t.dust.max);
            $('lvBar').innerHTML = t.levels.map((p, i) => '<div style="width:' + p + '%;background:' + LV[i][1] + '"></div>').join('');
            $('lvLegend').innerHTML = t.levels.map((p, i) => '<span style="color:' + LV[i][1] + '">● ' + LV[i][0] + ' ' + p + '%</span>').join('');
            c1.data.datasets[0].data = hr(t.hours, 'tmax'); c1.data.datasets[1].data = hr(t.hours, 'tmin');
            c2.data.datasets[0].data = hr(t.hours, 'pmax'); c2.data.datasets[1].data = hr(t.hours, 'smax');
            c1.update(); c2.update();
            $('rows').innerHTML = (Array.isArray(days) ? days : []).map(d =>
                '<tr class="border-t border-white/5"><td class="py-2">' + d.date + '</td><td>' + f(d.temp.max, ' °C') + '</td><td>' + f(d.temp.min, ' °C') +
                '</td><td class="' + (d.smoke.detected ? 'text-red-400' : 'text-green-400') + '">' + (d.smoke.detected ? 'ตรวจพบ' : 'ไม่พบ') +
                '</td><td>' + f(d.dust.avg) + '</td><td>' + f(d.dust.max) + '</td></tr>').join('');
        } catch (e) {
            $('date').textContent = 'โหลดข้อมูลไม่สำเร็จ: ' + e.message;
        }
    }
    load();
    setInterval(load, 30000);
</script>
</body>
</html>
